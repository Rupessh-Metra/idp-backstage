apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: deploy-to-kind
  title: Deploy to kind
  description: >-
    Deploys a private Docker Hub image to the local kind cluster as a
    Deployment and a matching ClusterIP Service, labeled so it shows up on
    the component's Kubernetes tab. If no tag is given, the most recently
    pushed tag is used automatically.
spec:
  owner: group:default/platform-admins
  type: service

  parameters:
    - title: What to deploy
      required:
        - name
        - repo
      properties:
        name:
          title: Name
          type: string
          description: >-
            Name of the Deployment/Service. Also set as the
            backstage.io/kubernetes-id label used to match this component's
            Kubernetes tab. Must be lowercase letters, numbers, and dashes,
            and start with a letter (e.g. "web-calci", not "3tier-backend").
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        repo:
          title: Docker Hub repo
          type: string
          description: >-
            Private Docker Hub repository in "namespace/repo" form, e.g.
            rupessh/web-calci
        tag:
          title: Tag (optional)
          type: string
          description: >-
            Exact tag to deploy. Leave blank to automatically use the most
            recently pushed tag.
        replicas:
          title: Replicas
          type: integer
          description: Number of pod replicas
          default: 1
        namespace:
          title: Namespace
          type: string
          description: Kubernetes namespace
          default: default
        containerPort:
          title: Container port
          type: integer
          description: Port the container listens on
          default: 80

  steps:
    - id: deploy
      name: Deploy to Kubernetes
      action: kubernetes:deploy
      input:
        name: ${{ parameters.name }}
        repo: ${{ parameters.repo }}
        tag: ${{ parameters.tag }}
        replicas: ${{ parameters.replicas }}
        namespace: ${{ parameters.namespace }}
        containerPort: ${{ parameters.containerPort }}

  output:
    text:
      - title: Deployed
        content: |
          Deployed **${{ steps['deploy'].output.image }}** as
          **${{ steps['deploy'].output.name }}** in namespace
          `${{ steps['deploy'].output.namespace }}`.
