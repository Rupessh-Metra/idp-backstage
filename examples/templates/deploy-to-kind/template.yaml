apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: deploy-to-kind
  title: Deploy to kind
  description: >-
    Deploys a container image to the local kind cluster as a Deployment and a
    matching ClusterIP Service, labeled so it shows up on the component's
    Kubernetes tab.
spec:
  owner: group:default/platform-admins
  type: service

  parameters:
    - title: What to deploy
      required:
        - name
        - image
      properties:
        name:
          title: Name
          type: string
          description: >-
            Name of the Deployment/Service. Also set as the
            backstage.io/kubernetes-id label used to match this component's
            Kubernetes tab.
          ui:autofocus: true
        image:
          title: Image
          type: string
          description: Container image to deploy, e.g. nginx:1.27
        replicas:
          title: Replicas
          type: integer
          description: Number of pod replicas
          default: 1
        namespace:
          title: Namespace
          type: string
          description: Kubernetes namespace
          default: default
        containerPort:
          title: Container port
          type: integer
          description: Port the container listens on
          default: 80

  steps:
    - id: deploy
      name: Deploy to Kubernetes
      action: kubernetes:deploy
      input:
        name: ${{ parameters.name }}
        image: ${{ parameters.image }}
        replicas: ${{ parameters.replicas }}
        namespace: ${{ parameters.namespace }}
        containerPort: ${{ parameters.containerPort }}

  output:
    text:
      - title: Deployed
        content: |
          Deployed **${{ steps['deploy'].output.name }}** to namespace
          `${{ steps['deploy'].output.namespace }}`.
